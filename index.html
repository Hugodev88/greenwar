<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crônicas da Separação — Brasil 2022</title>
<style>
  :root{
    --bg:#0e0d0c; --panel:#171513; --panel2:#1f1c19; --ink:#e9e1d3; --muted:#9c9182;
    --gold:#c9a45c; --red:#a8402f; --green:#5f8f5a; --blue:#4f7aa3; --line:#2e2a25;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{
    font-family: Georgia, "Times New Roman", "Liberation Serif", serif;
    line-height:1.65; min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(168,64,47,.18), transparent 60%),
      radial-gradient(ellipse at bottom, rgba(201,164,92,.08), transparent 60%),
      var(--bg);
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:16px}
  header h1{font-size:1.05rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0;font-weight:normal}
  .btn-sm{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit;font-size:.82rem}
  .btn-sm:hover{color:var(--ink);border-color:var(--gold)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  .stat .lbl{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
  .stat .val{color:var(--ink);font-weight:600}
  .bar{height:5px;background:#2a2622;border-radius:3px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;transition:width .6s ease;border-radius:3px}
  .delta{font-size:.7rem;margin-left:4px}
  .delta.up{color:#8fc488}.delta.down{color:#e07a66}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:8px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,.45);animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .chap{font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:4px}
  .card h2{margin:0 0 14px;font-size:1.6rem;font-weight:normal;color:var(--gold)}
  .card p{margin:0 0 14px;font-size:1.05rem}
  .card p:first-of-type::first-letter{font-size:2.6em;float:left;line-height:.9;padding:4px 8px 0 0;color:var(--gold)}
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  .choice{text-align:left;background:#14120f;border:1px solid var(--line);border-left:3px solid var(--gold);color:var(--ink);padding:13px 16px;border-radius:4px;cursor:pointer;font:inherit;font-size:1rem;transition:all .2s}
  .choice:hover:not(:disabled){background:#211d18;border-left-color:var(--red);transform:translateX(3px)}
  .choice:disabled{opacity:.42;cursor:not-allowed;border-left-color:#555}
  .choice small{display:block;font-family:system-ui,sans-serif;font-size:.74rem;color:var(--muted);margin-top:4px}
  .ending .chap{color:var(--gold)}
  .ending-tag{display:inline-block;font-family:system-ui,sans-serif;font-size:.75rem;padding:3px 10px;border-radius:20px;border:1px solid var(--gold);color:var(--gold);margin-bottom:12px}
  .summary{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
  .summary ol{padding-left:20px;margin:6px 0}
  .title-screen{text-align:center;padding:40px 22px}
  .title-screen h2{font-size:2.2rem;margin-bottom:4px}
  .title-screen .sub{color:var(--muted);font-style:italic;margin-bottom:22px}
  .title-screen p{text-align:left}
  .title-screen p:first-of-type::first-letter{all:unset}
  .disclaimer{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--muted);border:1px dashed var(--line);padding:8px 12px;border-radius:4px;margin:18px 0}
  .primary{background:var(--red);border:none;color:#fff;padding:12px 26px;border-radius:4px;font:inherit;font-size:1rem;cursor:pointer;margin:6px}
  .primary:hover{filter:brightness(1.15)}
  .secondary{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:11px 24px;border-radius:4px;font:inherit;font-size:1rem;cursor:pointer;margin:6px}
  .endings-found{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted);margin-top:16px}
  footer{margin-top:24px;text-align:center;font-family:system-ui,sans-serif;font-size:.72rem;color:#5d554b}
  /* ---- Menu de cenários ---- */
  .menu-head{text-align:center;margin:10px 0 22px}
  .menu-head h2{font-weight:normal;color:var(--gold);font-size:2rem;margin:0}
  .menu-head p{color:var(--muted);margin:4px 0 0;font-style:italic}
  .scen-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .scen{position:relative;background:linear-gradient(180deg,#221e1a,#151310);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:8px;padding:18px 18px 16px;display:flex;flex-direction:column;cursor:pointer;transition:transform .2s,border-color .2s}
  .scen:hover{transform:translateY(-3px);border-color:var(--gold)}
  .scen .yr{font-size:3rem;line-height:1;color:var(--gold);letter-spacing:.04em}
  .scen .tag{font-family:system-ui,sans-serif;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:6px 0 2px}
  .scen h3{margin:0 0 4px;font-weight:normal;font-size:1.3rem}
  .scen .dt{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--muted)}
  .scen .who{font-family:system-ui,sans-serif;font-size:.82rem;margin:10px 0 6px;padding:6px 8px;background:#0006;border-left:3px solid var(--gold)}
  .scen .ds{font-size:.95rem;color:#cfc6b6;flex:1}
  .scen .meta{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--muted);margin-top:10px;display:flex;justify-content:space-between;gap:8px}
  .scen .saved{color:#8fc488}
  .scen.soon{cursor:not-allowed;opacity:.55;border-top-color:#555;border-style:dashed;filter:grayscale(.85)}
  .scen.soon:hover{transform:none;border-color:var(--line)}
  .scen.soon .yr{color:#777}
  .scen.soon .tag{color:#8a8178}
  .scen .lockbadge{align-self:flex-start;font-family:system-ui,sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#bbb;border:1px solid #666;border-radius:20px;padding:3px 10px;margin-top:10px}
  /* cenário em destaque (o único jogável) */
  .scen.feat{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;padding:26px 26px 22px;border-top-width:4px;box-shadow:0 10px 40px #0008}
  .scen.feat:hover{transform:translateY(-2px)}
  .scen.feat .yr{font-size:5rem}
  .scen.feat h3{font-size:1.9rem}
  .scen.feat .ds{font-size:1.05rem;line-height:1.5;flex:none}
  .scen.feat .txt{display:flex;flex-direction:column}
  .scen.feat .cta{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .scen.feat .cta .go{font-family:system-ui,sans-serif;font-size:1rem;background:var(--red);color:#fff;border-radius:6px;padding:10px 22px;letter-spacing:.04em}
  .scen.feat:hover .cta .go{filter:brightness(1.15)}
  .scen.feat .mapbox{pointer-events:none;align-self:center;justify-self:center;width:100%;max-width:390px}
  .scen-later{margin-top:26px}
  .scen-later h4{font-family:system-ui,sans-serif;font-weight:normal;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .scen-later .scen-grid{grid-template-columns:repeat(auto-fill,minmax(260px,360px))}
  .scen-later .scen{padding:14px 16px}
  .scen-later .scen .yr{font-size:2.2rem}
  .scen-later .scen h3{font-size:1.1rem}
  .scen-later .scen .ds{font-size:.85rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  @media (max-width:760px){ .scen.feat{grid-template-columns:1fr;padding:18px} .scen.feat .yr{font-size:3.6rem} .scen.feat h3{font-size:1.5rem} .scen-later .scen-grid{grid-template-columns:1fr} }
  /* ---- Mapa ---- */
  .layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
  .layout.single{grid-template-columns:minmax(0,1fr);max-width:820px;margin:0 auto}
  .endmap h3{margin:0 0 6px;font-weight:normal;color:var(--gold);font-size:1rem;letter-spacing:.12em;text-transform:uppercase}
  .mapbox{position:relative}
  .mapbox svg{width:100%;height:auto;display:block}
  .mapbox path.uf{stroke:#0e0d0c;stroke-width:1;cursor:pointer;transition:fill .7s ease}
  .mapbox path.uf:hover{stroke:#fff;stroke-width:1.6}
  .mapbox path.uf.changed{animation:pulse 1.2s ease 3}
  @keyframes pulse{0%,100%{stroke:#0e0d0c;stroke-width:1}50%{stroke:#fff3c4;stroke-width:3.5}}
  .mapbox text{font-family:system-ui,sans-serif;font-size:12px;font-weight:600;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.75);stroke-width:3px;pointer-events:none;text-anchor:middle;dominant-baseline:middle}
  .mapbox line{stroke:#9c9182;stroke-width:.8;pointer-events:none}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:system-ui,sans-serif;font-size:.78rem;color:var(--muted);margin-top:8px}
  .legend span i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .maptip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--gold);color:var(--ink);font-family:system-ui,sans-serif;font-size:.8rem;padding:5px 9px;border-radius:4px;white-space:nowrap;transform:translate(-50%,-120%);display:none;z-index:5}
  .mapnotes{font-family:system-ui,sans-serif;font-size:.82rem;margin-top:10px}
  .mapnotes div{padding:4px 8px;border-left:3px solid var(--gold);background:#0006;margin-top:4px;animation:fade .6s ease}
  .card .mapnotes{margin:0 0 14px}
  .endmap{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  @media (max-width:900px){
    .layout{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:600px){
    .mapbox text{font-size:19px;stroke-width:4px}
    .mapbox{margin:0 -6px}
  }
  /* ---- Campanha ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .panel h3{margin:0 0 8px;font-weight:normal;color:var(--gold);font-size:1rem;letter-spacing:.12em;text-transform:uppercase}
  .sans,.hud,.tabs,.ufinfo,.deal,.predict,.fac,.act,.actor,.report,.hint,.muted,.pendbar,.notice,.why,.dealmsg,.conseq,.hist{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(90deg,#241a14,#171513);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:10px 14px;margin-bottom:10px}
  .hud-date strong{display:block;font-family:Georgia,serif;font-size:1.35rem;color:var(--gold);font-weight:normal;line-height:1.2}
  .hud-date small{color:var(--muted);font-size:.78rem}
  .hud-res{display:flex;gap:18px;flex:1;flex-wrap:wrap}
  .hud-res > div{display:flex;flex-direction:column;font-size:.8rem;line-height:1.3}
  .hud-res .k{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .hud-res b{font-size:1.1rem}.hud-res b.neg{color:#e07a66}
  .hud-res small{color:var(--muted);font-size:.72rem}
  .ap{display:inline-flex;gap:3px;margin:3px 0}.ap i{width:11px;height:11px;border-radius:50%;border:1px solid var(--gold);display:inline-block}.ap i.on{background:var(--gold)}
  .hud-res div:first-child{flex-direction:row;align-items:center;gap:6px;flex-wrap:wrap}.hud-res div:first-child .k{width:100%}
  .endbtn{margin:0;white-space:nowrap}
  .primary:disabled,.secondary:disabled{opacity:.4;cursor:not-allowed;filter:none}
  .primary.sm,.secondary.sm{padding:6px 12px;font-size:.82rem;margin:4px 4px 0 0}
  .stats{margin-bottom:10px}
  .stat{padding:6px 10px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
  .tab{background:transparent;border:1px solid transparent;border-bottom:none;color:var(--muted);padding:9px 16px;border-radius:6px 6px 0 0;font:inherit;font-size:.9rem;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--panel2);border-color:var(--line);color:var(--gold)}
  .tab:hover{color:var(--ink)}
  .badge{display:inline-block;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;font-size:.72rem;margin-left:3px}
  .pendbar{background:#3a1e17;border:1px solid var(--red);padding:7px 12px;border-radius:6px;margin-bottom:12px;font-size:.85rem}
  .linkbtn{background:none;border:none;color:var(--gold);text-decoration:underline;cursor:pointer;font:inherit;padding:0 4px}
  .card a{color:var(--gold)}
  .card.event{border-left:4px solid var(--gold)}
  .card.event.crisis{border-left-color:var(--red);background:linear-gradient(180deg,#2a1814,var(--panel))}
  .card.quiet{padding:18px 22px}.card.quiet p::first-letter{all:unset}
  .card.event p:first-of-type::first-letter{all:unset}
  .hint{color:var(--muted);font-size:.82rem;margin-top:8px}
  .report,.hist{margin-top:14px;padding:16px 20px}
  .report h3{margin:0 0 8px;font-weight:normal;color:var(--gold);font-size:1rem;letter-spacing:.1em;text-transform:uppercase}
  .report ul{margin:0;padding:0;list-style:none;font-size:.86rem}
  .report li{padding:4px 8px;border-left:3px solid #4a443c;margin-bottom:4px;background:#0004}
  .report li.good{border-left-color:#6fae6a}.report li.bad{border-left-color:#c2563f}.report li.war{border-left-color:#d0902a}.report li.story{border-left-color:var(--gold)}
  .hist summary{cursor:pointer;color:var(--muted);font-size:.85rem}.hist ol{font-size:.85rem;color:var(--muted)}
  .muted{color:var(--muted);font-size:.84rem}
  .intro{margin:0 0 12px}
  .notice{background:#2a2414;border:1px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:.82rem;text-align:left;margin:10px 0}
  .why{background:#0006;border-left:3px solid var(--gold);padding:6px 10px;font-size:.88rem;margin-bottom:12px}
  /* mapa */
  .maplayout,.diplayout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
  .diplayout{grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr)}
  .maphead{display:flex;justify-content:space-between;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .seg button{background:none;border:none;color:var(--muted);padding:4px 10px;font:inherit;font-family:system-ui,sans-serif;font-size:.76rem;cursor:pointer}
  .seg button.on{background:var(--gold);color:#111}
  .mapbox path.uf.sel{stroke:#fff;stroke-width:3}
  .mapbox path.uf.contested{stroke:#ffcf6e;stroke-dasharray:4 3;stroke-width:1.6}
  /* ---- exércitos, frentes, setas ---- */
  .mapbox .fx,.mapbox .arrows{pointer-events:none}
  .mapbox path.battlefx{fill:#ff5a3a;stroke:none;opacity:0;animation:battlepulse 1.8s ease-in-out infinite}
  @keyframes battlepulse{0%,100%{opacity:0}50%{opacity:.28}}
  .mapbox path.front{fill:none;stroke:#ff6a3d;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:5 3;filter:drop-shadow(0 0 2px #ff3b1f);animation:frontmove 1.2s linear infinite}
  .mapbox path.front.hot{stroke:#ffd166;stroke-width:3}
  @keyframes frontmove{to{stroke-dashoffset:-16}}
  .mapbox path.arw{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:9 5;animation:arwflow .9s linear infinite;filter:drop-shadow(0 0 1.5px #000)}
  .mapbox path.arw.pl{stroke:#f3c969;stroke-width:3.8}
  .mapbox path.arw.mv{stroke:#cfe3f5;stroke-width:2.6}
  .mapbox path.arw.rt{stroke:#b0a898;stroke-width:2.4}
  .mapbox path.arw.en{stroke:#ff6a52;stroke-dasharray:4 4;stroke-width:3}
  .mapbox path.arw.fade{opacity:0;transition:opacity .6s}
  @keyframes arwflow{to{stroke-dashoffset:-28}}
  .mapbox svg.small path.arw{stroke-width:4.6}.mapbox svg.small path.arw.pl{stroke-width:5.4}.mapbox svg.small path.front{stroke-width:3.4}
  .mapbox g.cnt{cursor:pointer}
  .mapbox g.cnt rect.bg{stroke:#0b0a09;stroke-width:1;filter:drop-shadow(0 1px 1.5px #000c)}
  .mapbox g.cnt.p rect.bg{fill:#2f5f8f}.mapbox g.cnt.e rect.bg{fill:#9a3526}
  .mapbox g.cnt .sym{fill:none;stroke:#e9eef3;stroke-width:1.1}
  .mapbox g.cnt.ord rect.bg{stroke:#f3c969;stroke-width:1.4}
  .mapbox g.cnt.sel rect.bg{stroke:#fff;stroke-width:2.2;animation:selglow 1s ease-in-out infinite alternate}
  @keyframes selglow{to{stroke:#f3c969}}
  .mapbox g.cnt:hover rect.bg{stroke:#fff}
  .mapbox text.cn{font-size:10px;font-weight:800;stroke:none;fill:#fff;text-anchor:middle;dominant-baseline:middle}
  .mapbox circle.badge{fill:#f3c969;stroke:#0b0a09;stroke-width:.8}
  .mapbox text.cb{font-size:7px;font-weight:800;stroke:none;fill:#1a1408;text-anchor:middle;dominant-baseline:middle}
  .mapbox g.cnt.fade{opacity:.15;transition:opacity .5s}
  .mapbox g.cnt.ghost{transition:transform 1.1s ease-in-out;pointer-events:none}
  .mapbox path.uf.tgt{stroke-width:2.4;animation:tgtpulse 1s ease-in-out infinite alternate}
  .mapbox path.uf.tgt-atacar{stroke:#ff5a3a}.mapbox path.uf.tgt-mover,.mapbox path.uf.tgt-recuar{stroke:#8fc8ff}
  .mapbox path.uf.origin{stroke:#fff;stroke-width:2.6}
  @keyframes tgtpulse{from{stroke-opacity:.45}to{stroke-opacity:1}}
  .mapbox path.uf.flipfx{animation:flipflash .9s ease}
  @keyframes flipflash{0%{filter:brightness(1)}25%{filter:brightness(2.6)}100%{filter:brightness(1)}}
  .mapbox g.boom .fl{animation:boomfl .7s ease-out forwards}
  .mapbox g.boom .sm{opacity:0;animation:smoke 1.8s ease-out forwards}
  .mapbox g.boom .s2{animation-delay:.15s}.mapbox g.boom .s3{animation-delay:.3s}
  @keyframes boomfl{0%{transform:scale(.2);opacity:1}60%{opacity:.9}100%{transform:scale(1.6);opacity:0}}
  @keyframes smoke{0%{opacity:0;transform:translateY(0) scale(.5)}25%{opacity:.85}100%{opacity:0;transform:translateY(-14px) scale(1.7)}}
  .maphint{font-size:.8rem;color:var(--muted);margin:2px 0 6px;font-family:system-ui,sans-serif}
  .maphint .hl-a{color:#ff7a5c}.maphint .hl-m{color:#8fc8ff}
  .ordchip{background:#1d1a15;border:1px solid var(--gold);color:var(--gold);border-radius:14px;padding:3px 10px;font-size:.78rem;cursor:pointer;font-family:system-ui,sans-serif;margin-left:auto;margin-right:8px}
  .ordchip.full{border-color:var(--red);color:#ff9d8a}
  .hudarmy{cursor:pointer}
  i.nato{display:inline-block;width:18px;height:12px;border:1px solid #e9eef3;border-radius:1px;flex:none;vertical-align:-1px;margin-right:6px;background-color:#2f5f8f;
    background-image:linear-gradient(to top right,transparent calc(50% - .7px),#e9eef3 50%,transparent calc(50% + .7px)),linear-gradient(to bottom right,transparent calc(50% - .7px),#e9eef3 50%,transparent calc(50% + .7px))}
  i.nato.e{background-color:#9a3526}
  i.nato.m{opacity:.6;border-style:dashed}
  .armyh{display:flex;align-items:center}
  .ordhead{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 6px;font-family:system-ui,sans-serif;font-size:.86rem;color:var(--gold)}
  .ordhead span{color:var(--muted);font-size:.78rem}.ordhead span.neg{color:#ff9d8a}
  .armylist{display:flex;flex-direction:column;gap:5px}
  .armyrow{display:flex;align-items:center;gap:4px;text-align:left;background:#14120f;border:1px solid var(--line);border-left:3px solid #4f7aa3;color:var(--ink);padding:7px 9px;border-radius:5px;cursor:pointer;font-family:system-ui,sans-serif;font-size:.84rem}
  .armyrow:hover{background:#211d18}.armyrow.has{border-left-color:var(--gold)}.armyrow.mil{cursor:default;border-left-color:#555;opacity:.85}
  .armyrow span{display:flex;flex-direction:column;flex:1;min-width:0}.armyrow small{color:var(--muted);font-size:.74rem}
  .armyrow em{font-style:normal;font-size:.74rem;color:var(--gold);white-space:nowrap}
  .ordbox p{font-size:.8rem}

<script>
/* =====================================================================
   DADOS DA HISTÓRIA
   Para expandir: adicione nós em STORY.nodes. Cada escolha tem:
     text   – texto do botão
     effects – {apoio, tesouro, militar, diplomacia} (somados, limitados a 0–100)
     next   – id do próximo nó  OU  lista de ramos condicionais:
              [{ if:{min:{militar:55}, max:{apoio:30}}, to:'id' }, ..., { to:'padrao' }]
     req    – (opcional) condição para a escolha estar disponível: {min:{...}, max:{...}}

   ===================================================================== */
/*SCENARIOS_START*/

/* ---------- Criação da partida ---------- */
function newCampaign(sc, seed){
  const S = sc.story, C = sc.campaign;
  const g = { v: SAVE_VERSION, scen: sc.id, seed: (seed >>> 0) || ((Date.now() ^ 0x5bd1e995) >>> 0),
    month: parseYM(C.start), startMonth: parseYM(C.start), turn: 1,
    stats: {}, flags: [], visited: [], history: [], lastDelta: {}, control: {}, lastMapChanges: [],
    money: C.money.initial, ap: C.ap,
    uf: {}, actors: {}, fac: {}, debts: [], drains: [], queue: [], report: [], log: [], used: {}, dealtWith: {},
    eventSeen: {}, chains: [], ended: null, enemyMalus: 0, malusUntil: 0, ceasefire: 0, enemyBoost: 0, counter: null,
    story: { node: null, due: 0 }, stat: { deals: 0, actions: 0, battles: 0 } };

  Object.assign(g.control, S.initialMap || {});
  for (const uf in MAP_DATA.states) g.uf[uf] = { unrest: (C.unrest && C.unrest[uf] !== undefined) ? C.unrest[uf] : (C.unrestBase ?? 25), enemy: 0, progress: 0, sway: 0 };
  for (const a of C.actors) g.actors[a.id] = { opinion: a.opinion, recognized: !!a.recognizes, dependence: 0, deals: 0, aligned: false, sanctioning: false, supportsEnemy: false };
  for (const f of C.factions) g.fac[f.id] = { loyalty: f.loyalty, influence: f.influence, lastCrisis: -99 };
  syncActorStats(g);
  prepContested(g);
  initArmies(g);

}
function prepContested(g){

    if ((s === "contested" || s === "enemy") && u.enemy <= 0) u.enemy = (C.enemyBase || 2) + (s === "enemy" ? 1 : 0);

}

/* ---------- Efeitos ---------- */
function applyStats(g, eff, viaStory){
  const sc = scOf(g), C = sc.campaign;
  for (const k in (eff||{})){
    if (!(k in g.stats)) continue;
    const before = g.stats[k];
    g.stats[k] = clamp(before + eff[k], 0, 100);
    const d = g.stats[k] - before;
    g.lastDelta[k] = (g.lastDelta[k]||0) + d;
    if (!d) continue;
    for (const f of C.factions) if (f.links && f.links[k]) bumpFac(g, f.id, d * f.links[k]);
    if (viaStory && C.actorStat) for (const aid in C.actorStat) if (C.actorStat[aid] === k) g.actors[aid].opinion = clamp(g.actors[aid].opinion + d*2, -100, 100);
  }
}
function bumpFac(g, id, d){ const f = g.fac[id]; if (f) f.loyalty = clamp(Math.round((f.loyalty + d) * 10) / 10, 0, 100); }
function bumpActor(g, id, d){ const a = g.actors[id]; if (a) a.opinion = clamp(Math.round(a.opinion + d), -100, 100); }
function syncActorStats(g){ const C = scOf(g).campaign; if (C.actorStat) for (const aid in C.actorStat){ const k = C.actorStat[aid]; if (k in g.stats) g.stats[k] = clamp(Math.round((g.actors[aid].opinion + 100) / 2), 0, 100); } }
function playerUFs(g){ const ph = phaseOf(g); return Object.keys(g.control).filter(uf => sideOf(g, g.control[uf], ph) === "player"); }
function applyFx(g, fx, rep){
  if (!fx) return;
  if (fx.s) applyStats(g, fx.s);
  if (fx.money) g.money = Math.round(g.money + fx.money);
  if (fx.reserve) addPlayerStrength(g, fx.reserve * STR_UNIT);
  if (fx.fac) for (const id in fx.fac) bumpFac(g, id, fx.fac[id]);
  if (fx.infl) for (const id in fx.infl) if (g.fac[id]) g.fac[id].influence = clamp(g.fac[id].influence + fx.infl[id], 5, 100);
  if (fx.unrest) for (const uf of playerUFs(g)) g.uf[uf].unrest = clamp(g.uf[uf].unrest + fx.unrest, 0, 100);
  if (fx.unrestAll) for (const uf in g.uf) g.uf[uf].unrest = clamp(g.uf[uf].unrest + fx.unrestAll, 0, 100);
  if (fx.unrestUF) for (const uf in fx.unrestUF) g.uf[uf].unrest = clamp(g.uf[uf].unrest + fx.unrestUF[uf], 0, 100);
  if (fx.act) for (const id in fx.act) bumpActor(g, id, fx.act[id]);
  if (fx.actAll) for (const id in g.actors) bumpActor(g, id, fx.actAll);
  if (fx.enemy) g.enemyBoost = Math.max(0, g.enemyBoost + fx.enemy);
  if (fx.flag && !g.flags.includes(fx.flag)) g.flags.push(fx.flag);
  if (fx.map) mapChange(g, { map: fx.map });
  if (fx.ap) g.ap = Math.max(0, g.ap + fx.ap);
  if (fx.ceasefire) g.ceasefire = Math.max(g.ceasefire, fx.ceasefire);
  if (fx.malus){ g.enemyMalus = Math.max(g.month <= g.malusUntil ? g.enemyMalus : 0, fx.malus.v); g.malusUntil = Math.max(g.malusUntil, g.month + fx.malus.months); }
  // efeitos de guerra usados pelos eventos: frentes, moral dos seus exércitos, perdas inimigas
  if (fx.front && g.armies){ const ph = phaseOf(g); for (const uf in g.control) if (sideOf(g, g.control[uf], ph) === "contested") g.uf[uf].progress = clamp(g.uf[uf].progress + fx.front, -100, 100); }
  if (fx.org && g.armies) for (const a of armiesOf(g, "player")) a.org = fx.org > 0 ? Math.min(Math.max(a.org, maxOrg(g, "player")), a.org + fx.org) : Math.max(5, a.org + fx.org);
  if (fx.enemyLoss && g.armies){ let left = fx.enemyLoss;
    while (left > 0){ const a = armiesOf(g, "enemy").sort((x, y) => y.str - x.str)[0]; if (!a) break; const d = Math.min(left, a.str); a.str -= d; left -= d; if (a.str < 3) removeArmy(g, a); } }

  if (fx.chain) for (const c of [].concat(fx.chain)) (g.chains ||= []).push({ id: c.id, due: g.month + (c.in || 1) });
  syncActorStats(g);
}
function fxSummary(g, fx){
  if (!fx) return "";
  const sc = scOf(g), S = sc.story, C = sc.campaign, out = [], sg = v => (v > 0 ? "+" : "") + v;
  if (fx.s) for (const k in fx.s) out.push(`${S.stats[k] ? S.stats[k].label : k} ${sg(fx.s[k])}`);
  if (fx.money) out.push(`${C.money.short} ${sg(fx.money)}`);
  if (fx.reserve) out.push(`Força militar ${sg(fx.reserve * STR_UNIT)}`);
  if (fx.fac) for (const id in fx.fac){ const f = C.factions.find(x => x.id === id); out.push(`${f ? f.short || f.name : id} ${sg(fx.fac[id])}`); }
  if (fx.infl) for (const id in fx.infl){ const f = C.factions.find(x => x.id === id); out.push(`Influência ${f ? f.short || f.name : id} ${sg(fx.infl[id])}`); }
  if (fx.unrest) out.push(`Agitação nos seus estados ${sg(fx.unrest)}`);
  if (fx.unrestAll) out.push(`Agitação geral ${sg(fx.unrestAll)}`);
  if (fx.act) for (const id in fx.act){ const a = C.actors.find(x => x.id === id); out.push(`Opinião ${a ? a.short || a.name : id} ${sg(fx.act[id])}`); }
  if (fx.actAll) out.push(`Opinião de todos os atores ${sg(fx.actAll)}`);
  if (fx.enemy) out.push(`Força inimiga ${sg(fx.enemy)}`);
  if (fx.unrestUF) out.push(`Agitação em ${Object.keys(fx.unrestUF).join("/")} ${sg(Object.values(fx.unrestUF)[0])}`);
  if (fx.ceasefire) out.push(`Trégua de ${fx.ceasefire} ${fx.ceasefire === 1 ? "mês" : "meses"}`);
  if (fx.malus) out.push(`Inimigo enfraquecido por ${fx.malus.months} meses`);
  if (fx.front) out.push(`Frentes ${sg(fx.front)}`);
  if (fx.org) out.push(`Moral dos seus exércitos ${sg(fx.org)}`);
  if (fx.enemyLoss) out.push(`Força inimiga −${fx.enemyLoss}`);
  if (fx.chain) out.push("Pode ter desdobramentos");

}

/* ---------- Mapa ---------- */
function mapChange(g, spec){
  if (!spec) return;
  const before = Object.assign({}, g.control);
  if (spec.resolve) for (const uf in g.control) if (spec.resolve[g.control[uf]]) g.control[uf] = spec.resolve[g.control[uf]];
  if (spec.map) Object.assign(g.control, spec.map);
  noteChanges(g, before);
}
function noteChanges(g, before){
  for (const uf in g.control) if (g.control[uf] !== before[uf]){
    const ex = g.lastMapChanges.find(c => c.uf === uf);
    if (ex) ex.to = g.control[uf]; else g.lastMapChanges.push({ uf, from: before[uf], to: g.control[uf] });
    const u = g.uf[uf]; u.progress = 0; u.sway = 0;
  }
  g.lastMapChanges = g.lastMapChanges.filter(c => c.from !== c.to);
  prepContested(g);
  syncMilitary(g, before);
}
function setControl(g, uf, fac){ const before = Object.assign({}, g.control); g.control[uf] = fac; noteChanges(g, before); }

/* ---------- História (eventos-chave roteirizados) ---------- */
function enterStory(g, id, rep){
  const sc = scOf(g), S = sc.story, n = S.nodes[id];
  g.story = { node: id, due: g.month, pending: false };
  if (!g.visited.includes(id)) g.visited.push(id);
  if (n.onEnter) mapChange(g, n.onEnter);
  const C = sc.campaign;
  if (C.enterFx && C.enterFx[id]) applyFx(g, C.enterFx[id]);
  if (C.focus) focusStoryGrant(g, id, rep);
  syncMilitary(g);
  if (n.ending){ endCampaign(g, id, null); return; }
  g.queue = g.queue.filter(q => q.type !== "story");

}
function storyDue(g, next){
  const C = scOf(g).campaign, at = C.storyAt && C.storyAt[next], dl = C.storyDelay && C.storyDelay[next];
  if (at) return Math.max(parseYM(at), g.month + (dl ?? 0));
  return g.month + (dl ?? (C.defaultDelay ?? 1));
}
function queueChoices(g){
  const q = g.queue[0]; if (!q) return [];
  const sc = scOf(g);
  if (q.type === "story") return sc.story.nodes[q.node].choices.map(c => ({ text: c.text, ok: cond(g, c.req), req: c.req, fx: c.effects ? { s: c.effects } : null }));
  const ev = findEvent(g, q.id);
  return ev.choices.map(c => ({ text: c.text, ok: cond(g, c.req), req: c.req, fx: c.fx }));
}
function choose(g, idx){
  const q = g.queue[0]; if (!q || g.ended) return false;
  const sc = scOf(g), S = sc.story, C = sc.campaign;
  if (q.type === "story"){
    const n = S.nodes[q.node], c = n.choices[idx];
    if (!c || !cond(g, c.req)) return false;
    g.queue.shift();
    applyStats(g, c.effects || {}, true);
    if (C.choiceFx && C.choiceFx[q.node] && C.choiceFx[q.node][idx]) applyFx(g, C.choiceFx[q.node][idx]);
    if (c.flag && !g.flags.includes(c.flag)) g.flags.push(c.flag);
    if (c.map) mapChange(g, { map: c.map });
    syncActorStats(g);
    g.history.push({ m: g.month, t: c.text });
    for (const k in S.collapse) if (g.stats[k] <= 0){ enterStory(g, S.collapse[k]); return true; }
    const next = resolveNextG(c.next, g), nn = S.nodes[next];
    if (nn.ending){ enterStory(g, next); return true; }
    const due = storyDue(g, next);
    if (due <= g.month) enterStory(g, next);
    else g.story = { node: next, due, pending: true };
    return true;
  }
  const ev = findEvent(g, q.id), c = ev.choices[idx];
  if (!c || !cond(g, c.req)) return false;
  g.queue.shift();
  if (ev.generic) resolveGenericDyn(g, q, idx); else applyFx(g, c.fx);
  g.history.push({ m: g.month, t: `${ev.title}: ${c.text}`, ev: true });
  if (c.next){
    const to = resolveNextG(c.next, g);
    if (to && S.nodes[to]) enterStory(g, to);
  }
  if (!g.ended) for (const k in S.collapse) if (g.stats[k] <= 0){ enterStory(g, S.collapse[k]); break; }
  return true;
}
function endCampaign(g, node, why){

  g.story = { node, due: g.month, pending: false };
  const n = scOf(g).story.nodes[node];
  if (n && n.onEnter && why) mapChange(g, n.onEnter); // finais por estado da campanha também aplicam o mapa final
  if (!g.visited.includes(node)) g.visited.push(node);
}

/* ---------- Eventos ---------- */
const GENERIC_EVENTS = [
  { id: "_dependencia", title: "Pressão de um parceiro", generic: true,
    text: ["{actor} lembra, com cortesia calculada, quanto o seu governo depende da ajuda recebida. Em troca da continuidade, pede alinhamento explícito em temas que dividem a sua base."],
    choices: [
      { text: "Ceder às exigências.", fx: { s: {}, dyn: "ceder" } },
      { text: "Recusar e buscar autonomia, mesmo com custo.", fx: { dyn: "recusar" } } ] },
];
function findEvent(g, id){ return (scOf(g).campaign.events || []).find(e => e.id === id) || GENERIC_EVENTS.find(e => e.id === id); }
function eventText(g, q){
  const ev = findEvent(g, q.id), C = scOf(g).campaign, a = q.actor ? C.actors.find(x => x.id === q.actor) : null;
  return ev.text.map(t => t.replace(/\{actor\}/g, a ? a.name : "Um parceiro"));
}
function pickRandomEvent(g){
  const C = scOf(g).campaign;
  const pool = (C.events || []).filter(e => !e.crisisOf && !e.chained && cond(g, e.if) && !(e.once && g.eventSeen[e.id]) && (g.month - (g.eventSeen[e.id] ?? -99)) >= (e.cooldown ?? 6));
  if (!pool.length) return null;
  let tot = pool.reduce((s, e) => s + (e.weight || 1), 0), r = rnd(g) * tot;
  for (const e of pool){ r -= (e.weight || 1); if (r <= 0) return e; }
  return pool[pool.length-1];
}

/* ---------- Ações (pontos de ação) ---------- */
function actionState(g, a){
  if (g.ended) return { ok: false, why: "Partida encerrada" };
  if (g.queue.length) return { ok: false, why: "Resolva os eventos pendentes" };
  if (g.used[a.id]) return { ok: false, why: "Já usada neste turno" };
  if (a.req && !cond(g, a.req)) return { ok: false, why: a.reqText || "Indisponível nesta fase" };
  if ((a.ap ?? 1) > g.ap) return { ok: false, why: "Pontos de ação insuficientes" };
  if ((a.cost || 0) > 0 && g.money < a.cost) return { ok: false, why: "Recursos insuficientes" };
  return { ok: true };
}
function visibleActions(g){ return (scOf(g).campaign.actions || []).filter(a => !a.show || cond(g, a.show)); }
function doAction(g, id){
  const a = scOf(g).campaign.actions.find(x => x.id === id);
  const st = actionState(g, a); if (!st.ok) return { ok: false, msg: st.why };
  g.ap -= (a.ap ?? 1); g.money -= (a.cost || 0); g.used[a.id] = true; g.stat.actions++;
  applyFx(g, a.fx);
  let msg = `${a.name}: ${fxSummary(g, a.fx) || "feito"}.`;
  if (a.risk && rnd(g) < a.risk.p){ applyFx(g, a.risk.fx); msg += ` ${a.risk.msg} (${fxSummary(g, a.risk.fx)})`; }
  checkCollapse(g);
  return { ok: true, msg };
}
function checkCollapse(g){
  const S = scOf(g).story;
  if (!g.ended) for (const k in S.collapse) if (g.stats[k] <= 0){ g.queue = []; enterStory(g, S.collapse[k]); return true; }
  return false;
}

/* ---------- Ações no mapa ---------- */
function mapActions(g, uf){
  const C = scOf(g).campaign, ph = phaseOf(g), s = sideOf(g, g.control[uf], ph), u = g.uf[uf], out = [];
  const war = !!ph.war, busy = g.queue.length > 0 || !!g.ended, mc = C.mapCost || {};
  const add = (kind, label, ap, cost, ok, why, desc) => out.push({ kind, label, ap, cost, ok: ok && !busy && g.ap >= ap && g.money >= cost, why: busy ? "Resolva os eventos pendentes" : (!ok ? why : (g.ap < ap ? "Pontos de ação insuficientes" : (g.money < cost ? "Recursos insuficientes" : ""))), desc });
  const flipTo = ph.flipTo && ph.flipTo[g.control[uf]];
  if (s === "player") add("investir", "Investir recursos", 1, mc.investir ?? 5, true, "", "Reduz a agitação (−15) e melhora a economia local.");
  if (s === "player" || flipTo) add("propaganda", "Propaganda", 1, mc.propaganda ?? 2, true, "", s === "player" ? "Reduz a agitação (−8)." : "Aumenta a simpatia pela sua causa (rumo a 100 = adesão).");
  if (s === "player" || s === "contested" || flipTo) add("negociar", "Negociar com o governador", 1, mc.negociar ?? 3, true, "", s === "player" ? "Acalma o estado (−20 agitação) se der certo." : (s === "contested" ? "Pode enfraquecer o inimigo local." : "Chance de ganhar adesão (+35 simpatia)."));
  return out;
}
function negotiateChance(g, uf){
  const C = scOf(g).campaign, u = g.uf[uf], pop = g.stats[C.keys.pop] ?? 50;
  return Math.round(clamp(45 + (pop - 50)*0.6 + u.sway*0.2 - u.unrest*0.1, 10, 85));
}
function doMapAction(g, uf, kind){
  const A = mapActions(g, uf).find(a => a.kind === kind);
  if (!A || !A.ok) return { ok: false, msg: A ? A.why : "Ação indisponível" };
  const C = scOf(g).campaign, ph = phaseOf(g), u = g.uf[uf], s = sideOf(g, g.control[uf], ph), name = MAP_DATA.states[uf].name;
  g.ap -= A.ap; g.money -= A.cost; g.stat.actions++;
  let msg = "";
  if (kind === "investir"){ u.unrest = clamp(u.unrest - 15, 0, 100); applyStats(g, C.keys.econ ? { [C.keys.econ]: 1 } : { [C.keys.pop]: 1 }); msg = `Investimento em ${name}: agitação ${Math.round(u.unrest)}.`; }
  else if (kind === "propaganda"){
    if (s === "player"){ u.unrest = clamp(u.unrest - 8, 0, 100); msg = `Propaganda em ${name}: agitação ${Math.round(u.unrest)}.`; }
    else { u.sway = clamp(u.sway + 15 + Math.round(((g.stats[C.keys.pop] ?? 50) - 50)/5), -100, 100); msg = `Propaganda em ${name}: simpatia ${Math.round(u.sway)}/100.`; checkSway(g, uf); }
  } else if (kind === "negociar"){
    const ch = negotiateChance(g, uf), ok = rnd(g)*100 < ch;
    if (!ok){ u.sway = clamp(u.sway - 5, -100, 100); msg = `As conversas em ${name} fracassaram (chance era ${ch}%).`; }
    else if (s === "player"){ u.unrest = clamp(u.unrest - 20, 0, 100); msg = `Acordo com o governo de ${name}: agitação ${Math.round(u.unrest)}.`; }
    else if (s === "contested"){ u.enemy = Math.max(0, u.enemy - 1); u.progress = clamp(u.progress + 15, -100, 100); msg = `Negociação local em ${name}: força inimiga ${u.enemy}.`; }
    else { u.sway = clamp(u.sway + 35, -100, 100); msg = `O governo de ${name} se aproxima (simpatia ${Math.round(u.sway)}/100).`; checkSway(g, uf); }
  }
  return { ok: true, msg };
}
function checkSway(g, uf){
  const ph = phaseOf(g), u = g.uf[uf], to = ph.flipTo && ph.flipTo[g.control[uf]];
  if (to && u.sway >= 100){ setControl(g, uf, to); return true; }
  return false;
}

/* ---------- Facções internas ---------- */
function factionAction(g, id, kind){
  const C = scOf(g).campaign, F = C.factions.find(f => f.id === id), f = g.fac[id];
  if (g.queue.length || g.ended) return { ok: false, msg: "Resolva os eventos pendentes" };
  const key = "fac_" + kind + "_" + id;
  if (g.used[key]) return { ok: false, msg: "Já feito neste turno" };
  if (g.ap < 1) return { ok: false, msg: "Pontos de ação insuficientes" };
  const cost = kind === "agradar" ? (F.favorCost ?? C.favorCost ?? 4) : 0;
  if (g.money < cost) return { ok: false, msg: "Recursos insuficientes" };
  g.ap--; g.money -= cost; g.used[key] = true; g.stat.actions++;
  if (kind === "agradar"){
    bumpFac(g, id, 14);
    for (const r of (F.rivals||[])) bumpFac(g, r, -5);
    if (F.favorFx) applyFx(g, F.favorFx);
    return { ok: true, msg: `${F.name}: lealdade +14${(F.rivals||[]).length ? " (rivais −5)" : ""}.` };
  }
  f.influence = clamp(f.influence - 10, 5, 100); bumpFac(g, id, -12);
  if (F.pressFx) applyFx(g, F.pressFx);
  return { ok: true, msg: `${F.name}: influência −10, lealdade −12.` };
}
function facStatus(f){ return f.loyalty >= 65 ? "Leal" : f.loyalty >= 35 ? "Neutra" : f.loyalty >= 15 ? "Insatisfeita" : "Em crise"; }

/* ---------- Diplomacia ---------- */
function actorDef(g, id){ return scOf(g).campaign.actors.find(a => a.id === id); }
function dipLabels(g){ const C = scOf(g).campaign, ph = phaseOf(g); return { req: Object.assign({}, REQ_LABEL, C.reqLabels || {}, (ph.diplo||{}).reqLabels || {}), off: Object.assign({}, OFF_LABEL, C.offLabels || {}, (ph.diplo||{}).offLabels || {}) }; }
function allowedReqs(g, aid){

function dealHint(score){

  if (score >= 0) return { label: "Provável", cls: "good" };
  if (score >= -25) return { label: "Vão pedir algo em troca", cls: "mid" };

}
function dealCheck(g, aid, req, off){
  if (g.ended) return "Partida encerrada";
  if (g.queue.length) return "Resolva os eventos pendentes";

function proposeDeal(g, aid, req, off){

    const ao = allowedOffs(g, aid).filter(o => !off.includes(o) && (A.interests[o] || 0) > 0)
      .sort((a, b) => (A.interests[b] || 0) * OFF_BASE[b] - (A.interests[a] || 0) * OFF_BASE[a]);

}
function acceptCounter(g){
  const c = g.counter; if (!c || g.ended) return { ok: false, msg: "Sem contraproposta" };

  return { ok: true, msg: `${actorDef(g, c.aid).name}: acordo fechado. ` + applyDeal(g, c.aid, c.req, c.off) };
}
function applyDeal(g, aid, req, off){
  const sc = scOf(g), C = sc.campaign, A = actorDef(g, aid), st = g.actors[aid], K = C.keys, out = [];
  st.deals++; g.stat.deals++;
  bumpActor(g, aid, 5);
  const rel = A.rel || {};
  for (const r of req){
    if (r === "dinheiro"){ const amt = C.loan || 15, due = g.month + 6; g.money += amt; g.debts.push({ aid, amount: Math.round(amt * 1.3), due }); out.push(`+${amt} ${C.money.short} (dívida de ${Math.round(amt*1.3)} vence em ${monthLabel(due)})`); }
    if (r === "armas"){ const got = addPlayerStrength(g, 2 * STR_UNIT); g.armsAid = { v: Math.min(0.3, armsAid(g) + 0.12), until: g.month + 6 }; applyStats(g, { [K.mil]: 4 }); st.dependence += 10; out.push(`${got ? `+${got} de força militar, ` : ""}armas estrangeiras (+${Math.round(g.armsAid.v * 100)}% em combate por 6 meses), ${sc.story.stats[K.mil].label} +4, dependência maior`); }
    if (r === "reconhecimento"){ st.recognized = true; applyStats(g, { [K.legit]: 8 }); for (const o in rel) if (rel[o] >= 0.5) bumpActor(g, o, 4); out.push(`reconhecimento obtido (${sc.story.stats[K.legit].label} +8)`); }
    if (r === "sancoes"){ g.enemyMalus = 1; g.malusUntil = g.month + 4; out.push("sanções enfraquecem o inimigo por 4 meses"); }
    if (r === "mediacao"){ if (isWar(g)) g.ceasefire = 2; applyFx(g, { unrestAll: -10, s: { [K.legit]: 3, [K.pop]: 2 } }); out.push(isWar(g) ? "trégua mediada de 2 meses, agitação −10" : "mediação reduz a agitação (−10)"); }

    if (o === "bases"){ st.dependence += 20; for (const x in rel) if (rel[x] < 0) bumpActor(g, x, -15 * Math.abs(rel[x])); out.push("bases cedidas: rivais irritados, dependência maior"); }
    if (o === "onu"){ for (const x in rel) if (rel[x] < 0) bumpActor(g, x, -8 * Math.abs(rel[x])); bumpActor(g, aid, 5); }

function diploMission(g, aid){

/* ---------- Árvore de decisões nacionais (focos) ---------- */
const FOCUS_FX_KEYS = ["s","money","reserve","fac","infl","unrest","unrestAll","unrestUF","act","actAll","enemy","flag","map","ap","ceasefire","malus"];
const EVENT_FX_KEYS = FOCUS_FX_KEYS.concat(["front", "org", "enemyLoss", "chain"]);
function focusTree(g){ return scOf(g).campaign.focus || null; }
function focusInit(g){ if (focusTree(g) && !g.focus) g.focus = { done: [], active: null, prog: 0, started: 0, dipBonus: {}, req: [], off: [], hist: [] }; return g.focus; }
function focusDef(g, id){ const T = focusTree(g); return T ? T.nodes.find(n => n.id === id) : null; }
function focusName(g, id){ const F = focusDef(g, id); return F ? F.name : id; }
function focusStatus(g, F){
  const f = g.focus;
  if (!f) return { state: "unavailable", why: "" };
  if (f.done.includes(F.id)) return { state: "done", why: "Concluído" };
  if (f.active === F.id) return { state: "active", why: `Em andamento: ${f.prog}/${F.months} ${F.months === 1 ? "mês" : "meses"}` };
  const ex = (F.excl || []).find(x => f.done.includes(x) || f.active === x);

  if (F.lockIf && cond(g, F.lockIf)) return { state: "locked", why: F.lockText || "Bloqueado pela história" };
  const miss = (F.req || []).filter(r => !f.done.includes(r));
  const anyOk = !F.reqAny || F.reqAny.some(r => f.done.includes(r));
  if (miss.length || !anyOk){
    const parts = []; if (miss.length) parts.push(miss.map(r => focusName(g, r)).join(" + "));
    if (!anyOk) parts.push("um de: " + F.reqAny.map(r => focusName(g, r)).join(" / "));
    return { state: "prereq", why: "Requer " + parts.join("; ") };
  }
  if (F.avail && !cond(g, F.avail)) return { state: "unavailable", why: F.availText || "Indisponível agora" };

}
function focusCheck(g, id){
  const T = focusTree(g), F = focusDef(g, id);
  if (!T || !F) return "Foco inexistente";
  if (g.ended) return "Partida encerrada";
  if (g.queue.length) return "Resolva os eventos pendentes";
  if (g.focus.active) return `Já há um foco em andamento (${focusName(g, g.focus.active)})`;
  const st = focusStatus(g, F); if (st.state !== "available") return st.why;
  if (g.ap < (T.ap ?? 1)) return "Pontos de ação insuficientes";
  if ((F.cost || 0) > g.money) return "Recursos insuficientes";

}
function startFocus(g, id){
  const bad = focusCheck(g, id); if (bad) return { ok: false, msg: bad };
  const T = focusTree(g), F = focusDef(g, id);
  g.ap -= (T.ap ?? 1); g.money -= (F.cost || 0); g.focus.active = id; g.focus.prog = 0; g.focus.started = g.month; g.stat.actions++;

}
function cancelFocus(g){
  if (!g.focus || !g.focus.active || g.ended) return { ok: false, msg: "Nenhum foco em andamento" };
  const n = focusName(g, g.focus.active); g.focus.active = null; g.focus.prog = 0;
  return { ok: true, msg: `Foco cancelado: ${n}. O progresso foi perdido.` };
}
function focusUnlocks(g, F){
  const C = scOf(g).campaign, flag = "fo_" + F.id, out = [], L = dipLabels(g);
  for (const a of C.actions) if (a.show && (a.show.flags || []).includes(flag)) out.push(`Libera ação: ${a.name}`);
  for (const e of C.events) if (e.if && (e.if.flags || []).includes(flag)) out.push(`Pode disparar o evento: ${e.title}`);
  for (const o of (F.dipOff || [])) out.push(`Diplomacia: libera a oferta “${OFF_LABEL[o]}” em todas as fases`);
  for (const r of (F.dipReq || [])) out.push(`Diplomacia: libera o pedido “${REQ_LABEL[r]}”`);
  for (const aid in (F.dipBonus || {})){ const A = actorDef(g, aid); out.push(`Acordos com ${A ? A.short || A.name : aid} +${F.dipBonus[aid]} na previsão`); }
  if (F.fx && F.fx.flag === "conspiracao") out.push("Marca a conspiração nos autos (pesa no capítulo 'Nos Tribunais')");

}
function completeFocus(g, F, R){
  const f = g.focus, C = scOf(g).campaign;
  f.done.push(F.id); f.active = null; f.prog = 0; f.hist.push({ id: F.id, m: g.month });
  if (!g.flags.includes("fo_" + F.id)) g.flags.push("fo_" + F.id);
  applyFx(g, F.fx);
  for (const aid in (F.dipBonus || {})) f.dipBonus[aid] = (f.dipBonus[aid] || 0) + F.dipBonus[aid];
  for (const o of (F.dipOff || [])) if (!f.off.includes(o)) f.off.push(o);
  for (const r of (F.dipReq || [])) if (!f.req.includes(r)) f.req.push(r);
  R(`Foco nacional concluído: ${F.name}${F.fx ? ` — ${fxSummary(g, F.fx)}` : ""}.`, "good");
  if (F.risk && rnd(g) < F.risk.p){ applyFx(g, F.risk.fx); R(`${F.risk.msg} (${fxSummary(g, F.risk.fx)})`, "bad"); }

function focusTick(g, months, R){

  const f = focusInit(g);

  const F = focusDef(g, f.active);
  const st = focusStatus(g, Object.assign({}, F, { id: "__probe" }));

  f.prog += months;

function focusStoryGrant(g, node, rep){
  const T = focusTree(g); if (!T || !T.grants || !T.grants[node]) return;
  const f = focusInit(g);
  for (const id of T.grants[node]) if (!f.done.includes(id)){ if (f.active === id){ f.active = null; f.prog = 0; } f.done.push(id); f.hist.push({ id, m: g.month, story: true }); if (!g.flags.includes("fo_" + id)) g.flags.push("fo_" + id); if (rep) rep.push({ t: `A história impôs o foco “${focusName(g, id)}”.`, k: "mid" }); }
}

/* ---------- Encerrar o mês ---------- */
function paceFor(g){
  const C = scOf(g).campaign, ph = phaseOf(g);
  if (ph.war) return 1;
  let p = 1;
  for (const s of (C.pace || [])) if (g.month >= parseYM(s.from)) p = s.months;
  return p;
}
function incomeFor(g){
  const sc = scOf(g), C = sc.campaign, ph = phaseOf(g), K = C.keys;
  const sides = sideCounts(g), strength = sideStr(g, "player");
  const base = ph.income ?? 4, terr = sides.wPlayer * (ph.perWeight ?? 0.2), econ = K.econ ? ((g.stats[K.econ] - 50) / 10) : 0;
  const upkeep = strength / STR_UNIT * (C.upkeep ?? 0.4), sanc = Object.values(g.actors).filter(a => a.sanctioning).length * 2;
  const facBonus = C.factions.reduce((s, f) => s + ((f.boostMoney && g.fac[f.id].loyalty >= 65) ? f.boostMoney : 0) - ((f.boostMoney && g.fac[f.id].loyalty <= 25) ? f.boostMoney : 0), 0);
  return { base, terr, econ, upkeep, sanc, facBonus, total: Math.round(base + terr + econ - upkeep - sanc + facBonus) };
}
function endTurn(g){
  if (g.ended) return false;
  if (g.queue.length) return false;
  const sc = scOf(g), S = sc.story, C = sc.campaign, K = C.keys, rep = [];
  const R = (t, k) => rep.push({ t, k: k || "info" });
  g.lastDelta = {}; g.lastMapChanges = []; g.counter = null;
  let pace = paceFor(g);
  if (g.story.pending) pace = Math.min(pace, Math.max(1, g.story.due - g.month));
  const from = g.month; g.month += pace; g.turn++;
  R(pace > 1 ? `Passaram-se ${pace} meses (${monthLabel(from)} → ${monthLabel(g.month)}).` : `Novo mês: ${monthLabel(g.month)}.`);
  // 1. Economia
  const inc = incomeFor(g);
  g.money += inc.total * pace;
  R(`Receita líquida: ${inc.total >= 0 ? "+" : ""}${inc.total * pace} ${C.money.short} (base ${Math.round(inc.base)}, território +${Math.round(inc.terr)}, manutenção de tropas −${Math.round(inc.upkeep)}${inc.sanc ? `, sanções −${inc.sanc}` : ""}${inc.econ ? `, economia ${inc.econ > 0 ? "+" : ""}${Math.round(inc.econ)}` : ""}${inc.facBonus ? `, facções ${inc.facBonus > 0 ? "+" : ""}${inc.facBonus}` : ""}).`, inc.total >= 0 ? "good" : "bad");
  for (const d of g.drains) if (d.until > from){ const m = Math.min(pace, d.until - from); g.money -= d.amount * m; }
  g.drains = g.drains.filter(d => d.until > g.month);
  for (const d of g.debts.filter(d => d.due <= g.month)){
    const A = actorDef(g, d.aid);
    if (g.money >= d.amount){ g.money -= d.amount; R(`Dívida paga a ${A.name}: −${d.amount} ${C.money.short}.`, "bad"); }
    else { bumpActor(g, d.aid, -30); applyStats(g, K.econ ? { [K.econ]: -8, [K.legit]: -4 } : { [K.legit]: -6, [K.pop]: -3 }); g.money -= Math.round(d.amount / 2); R(`Calote! Sem caixa para pagar ${A.name}: metade renegociada às pressas, opinião −30.`, "bad"); }
  }
  g.debts = g.debts.filter(d => d.due > g.month);
  if (g.money < 0){ applyStats(g, Object.assign({ [K.pop]: -2 }, C.keys.money ? { [C.keys.money]: -2 } : {})); R("Cofres no vermelho: salários atrasam e a confiança cai.", "bad"); }
  else if (C.keys.money){ if (g.money < 3) applyStats(g, { [C.keys.money]: -1 }); else if (g.money >= (C.money.comfort ?? 20)) applyStats(g, { [C.keys.money]: g.money > (C.money.comfort ?? 20) + 15 ? 2 : 1 }); }
  // 1b. Foco nacional (árvore de decisões)
  if (C.focus) focusTick(g, pace, R);
  // 2. Mapa: agitação, simpatia, combates, inimigo
  const ph = phaseOf(g);
  const pop = g.stats[K.pop] ?? 50, econ = K.econ ? g.stats[K.econ] : 50, mil = g.stats[K.mil] ?? 50;
  let sumUnrest = 0, nP = 0;
  for (const uf in g.uf){
    const u = g.uf[uf], s = sideOf(g, g.control[uf], ph);
    const target = clamp(55 - (pop - 50)*0.7 - (econ - 50)*0.3 - Math.min(24, sideStr(g, "player", uf) / STR_UNIT * 4) + (s === "contested" ? 20 : 0) + (C.unrestBias || 0), 5, 95);
    u.unrest = clamp(Math.round(u.unrest + (target - u.unrest)*0.2 + (rnd(g)*8 - 4)), 0, 100);
    if (s !== "player") u.sway = clamp(u.sway - 5*pace, -100, 100);
    if (s === "player"){ sumUnrest += u.unrest; nP++; }
  }
  const avgU = nP ? sumUnrest / nP : 0;
  if (nP && avgU > 62){ applyStats(g, { [K.pop]: -2 }); R(`Agitação alta nos seus estados (média ${Math.round(avgU)}).`, "bad"); }
  else if (nP && avgU < 30) applyStats(g, { [K.pop]: 1 });
  // revoltas / perdas por agitação extrema
  for (const uf of playerUFs(g)){
    const u = g.uf[uf];
    if (u.unrest >= 88 && sideStr(g, "player", uf) < 20){
      if (ph.war && ph.revoltTo !== null){ setControl(g, uf, C.contested); g.uf[uf].enemy = Math.max(g.uf[uf].enemy, 2); R(`Revolta em ${MAP_DATA.states[uf].name}: o estado entrou em disputa.`, "bad"); }
      else if (ph.loseTo && ph.loseTo[g.control[uf]]){ setControl(g, uf, ph.loseTo[g.control[uf]]); R(`${MAP_DATA.states[uf].name} escapou da sua influência após protestos.`, "bad"); }
      else { applyStats(g, { [K.pop]: -2 }); u.unrest = 70; R(`Grandes protestos em ${MAP_DATA.states[uf].name}.`, "bad"); }
    }
  }
  // 2b. Operações militares: ordens dos exércitos (jogador) + plano da IA inimiga
  if (ph.war){
    const cf = g.ceasefire > 0;
    if (cf){ g.ceasefire--; R("Trégua em vigor: sem combates neste mês (só deslocamentos).", "good"); }
    militaryMonth(g, R, !cf);
    if (!cf && phaseOf(g).war){
      enemyReinforce(g, R);
      playerMobilize(g, R);
      const sides = sideCounts(g), tot = sides.wPlayer + sides.wEnemy + sides.wContested;
      const share = tot ? sides.wPlayer / tot : 1;
      if (share > 0.65) applyStats(g, { [K.mil]: 1 }); else if (share < 0.35) { applyStats(g, { [K.mil]: -2 }); R("Você controla pouco território: o moral das tropas cai.", "bad"); }
      if (sides.contested >= 3) applyStats(g, { [K.pop]: -1 });
    }
    g.enemyBoost = Math.max(0, g.enemyBoost - 0.25);
  } else militaryMonth(g, R, false);
  // 3. Facções

/* ---------- Camadas militares do mapa: fronteiras de frente, setas de ordens, contadores (OTAN) ---------- */
const STATE_PTS = {}, BORDER_CACHE = {};
function statePts(uf){ return STATE_PTS[uf] || (STATE_PTS[uf] = [...MAP_DATA.states[uf].d.matchAll(/(-?\d+\.?\d*),(-?\d+\.?\d*)/g)].map(m => [+m[1], +m[2]])); }
// Trecho de fronteira compartilhado entre dois estados (vértices de A encostados no polígono de B)
function sharedBorder(a, b){
  const k = a < b ? a + b : b + a; if (k in BORDER_CACHE) return BORDER_CACHE[k];
  const A = statePts(a < b ? a : b), B = statePts(a < b ? b : a);
  const segd = (p, s, t) => { const dx = t[0]-s[0], dy = t[1]-s[1], L = dx*dx+dy*dy; let u = L ? ((p[0]-s[0])*dx + (p[1]-s[1])*dy) / L : 0; u = Math.max(0, Math.min(1, u)); return Math.hypot(s[0]+u*dx-p[0], s[1]+u*dy-p[1]); };
  const near = A.map(p => { for (let i = 0; i < B.length - 1; i++) if (segd(p, B[i], B[i+1]) < 0.8) return true; return false; });
  let d = "", run = [];
  const flush = () => { if (run.length >= 2) d += "M" + run.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L"); run = []; };
  A.forEach((p, i) => { if (near[i]) run.push(p); else flush(); }); flush();
  return (BORDER_CACHE[k] = d);
}
const MOBILE_MAP = () => window.innerWidth < 600;
function ufAnchor(uf){ const s = MAP_DATA.states[uf], o = LABEL_POS[uf]; return o ? { x: o[0], y: o[1], side: true } : { x: s.lx, y: s.ly }; }

}
function counterSVG(side, uf, list, opts){

  const str = Math.round(list.reduce((s, a) => s + a.str, 0)), sel = opts.selArmy && list.some(a => a.id === opts.selArmy.id);

}
function arrowSVG(from, to, cls){
  const a = MAP_DATA.states[from], b = MAP_DATA.states[to];

}

// Monta as camadas militares (frentes, pulsos, setas, contadores) para um estado de jogo
function militaryLayers(g, control, opts){

  const s = sideOf(G, G.control[uf]), pRole = s === "player" ? "def" : "att", eRole = s === "enemy" ? "def" : "att";
  const toU = u => ({ name: u.name, gen: u.gen || null, militia: !!u.militia, str0: Math.round(u.str), org0: Math.round(u.org) });
  const pm = milMods(G, "player", uf, pRole, pU), em = milMods(G, "enemy", uf, eRole, eU);
  const pp = pU.reduce((t, u) => t + armyPow(u), 0) * modsMult(pm), ep = eU.reduce((t, u) => t + armyPow(u), 0) * modsMult(em);
  const rec = { uf, kind: "frente", month: G.month, rounds: [], sides: [{ side: "player", role: pRole, mods: pm, units: pU.map(toU) }, { side: "enemy", role: eRole, mods: em, units: eU.map(toU) }] };
  if (!pU.length) rec.sides[0].units = [{ name: "Nenhuma força sua aqui", militia: true, str0: 0, org0: 0 }];
  if (!eU.length) rec.sides[1].units = [{ name: "Nenhuma força inimiga conhecida", militia: true, str0: 0, org0: 0 }];
  const ratio = ep > 0 ? pp / ep : (pp > 0 ? 9.99 : 1);
  openBattle(rec, { forecast: true, ratio, note: s === "contested" ? `A frente está em ${G.uf[uf].progress > 0 ? "+" : ""}${Math.round(G.uf[uf].progress)} (+100 conquista · −100 perda). Ela é disputada a cada Encerrar mês; mande exércitos para pesar a balança.` : "Estimativa sem sorte: a batalha real tem até 5 rodadas e quem perder a moral recua." });

    <div class="mapbox" id="resolMap"></div><div class="rcap">Ordens do mês</div><div class="rlist"></div><div class="bbtns"><button class="primary" data-done style="display:none">Continuar</button></div></div>`;
  document.body.appendChild(o); document.body.classList.add("noscroll");
  const box = o.querySelector("#resolMap"), cap = o.querySelector(".rcap"), list = o.querySelector(".rlist");
  const control = Object.assign({}, ev.control0);
  const startArmies = ev.start.map(a => Object.assign({}, a));
  box.innerHTML = mapSVG(control, [], { g: G, military: true, armies: startArmies, arrows: ev.orders, static: true });
  const svg = box.querySelector("svg"), fxLayer = document.createElementNS("http://www.w3.org/2000/svg", "g"); svg.appendChild(fxLayer);
  const timers = []; const later = (fn, ms) => timers.push(setTimeout(fn, ms * sp));
  const flipFill = (uf, fac) => { const p = svg.querySelector(`path.uf[data-uf="${uf}"]`); const f = STORY.factions[fac]; if (p && f){ p.setAttribute("fill", f.color); p.classList.remove("flipfx"); void p.getBoundingClientRect(); p.classList.add("flipfx"); } control[uf] = fac; };
  const boom = uf => { const s = MAP_DATA.states[uf]; fxLayer.insertAdjacentHTML("beforeend", `<g class="boom" transform="translate(${s.lx},${s.ly})"><circle class="fl" r="16" fill="url(#fls)"/><circle class="sm s1" r="12" fill="url(#smk)"/><circle class="sm s2" r="10" cx="8" cy="-4" fill="url(#smk)"/><circle class="sm s3" r="9" cx="-7" cy="-6" fill="url(#smk)"/></g>`); };
  const usedFlips = new Set();
  let t = 1300;
  ev.battles.forEach((b, i) => {
    later(() => {
      boom(b.uf);
      const pw = b.sides[b.win].side === "player";
      cap.textContent = `${MAP_DATA.states[b.uf].name}: ${pw ? "vitória sua" : "vitória inimiga"}${b.result ? " — " + b.result : ""}`;
      cap.className = "rcap " + (pw ? "good" : "bad");
      list.appendChild(resolBtn(b));
      ev.flips.forEach((f, k) => { if (f.uf === b.uf && !usedFlips.has(k)){ usedFlips.add(k); later(() => flipFill(f.uf, f.to), 450); } });
    }, t);
    t += Math.max(700, 1300 - ev.battles.length * 60);
  });
  later(() => { ev.flips.forEach((f, k) => { if (!usedFlips.has(k)) flipFill(f.uf, f.to); }); }, t);
  // deslocamentos: contadores fantasmas deslizam do estado de origem para o destino
  later(() => {
    svg.querySelectorAll("path.arw").forEach(p => p.classList.add("fade"));
    if (!ev.moves.length) return;
    svg.querySelectorAll("g.cnt").forEach(c => c.classList.add("fade"));
    cap.textContent = "Movimentos e recuos"; cap.className = "rcap";
    for (const m of ev.moves){
      const a = ev.start.find(x => x.id === m.id) || { str: 0 }, from = counterPos(m.from, m.side, false), to = counterPos(m.to, m.side, false);
      const k = MOBILE_MAP() ? 1.3 : 1;
      fxLayer.insertAdjacentHTML("beforeend", `<g class="cnt ghost ${m.side === "player" ? "p" : "e"}" style="transform:translate(${from.x}px,${from.y}px) scale(${k})"><rect class="bg" x="-15" y="-7.5" width="30" height="15" rx="2"/><rect class="sym" x="-13" y="-5.5" width="10" height="11"/><path class="sym" d="M-13,-5.5L-3,5.5M-13,5.5L-3,-5.5"/><text class="cn" x="6.5" y="0.5">${Math.round(a.str)}</text></g>`);
      const gh = fxLayer.lastElementChild; requestAnimationFrame(() => requestAnimationFrame(() => { gh.style.transform = `translate(${to.x}px,${to.y}px) scale(${k})`; }));
    }
  }, t + 200);
  t += ev.moves.length ? 1400 : 400;
  later(() => {
    const L = mapSVG(G.control, [], { g: G, military: true, arrows: [], static: true });
    box.innerHTML = L; cap.textContent = ev.battles.length ? "Toque numa batalha para ver o combate e o relatório (por que venceu ou perdeu)." : "Fim da resolução."; cap.className = "rcap";
    o.querySelector("[data-done]").style.display = ""; o.querySelector("[data-skip]").style.display = "none";
  }, t);
  const skip = () => { timers.forEach(clearTimeout); box.innerHTML = mapSVG(G.control, [], { g: G, military: true, arrows: [], static: true });
    list.innerHTML = ""; ev.battles.forEach(b => list.appendChild(resolBtn(b)));
    cap.textContent = ev.battles.length ? "Toque numa batalha para ver o combate e o relatório (por que venceu ou perdeu)." : "Fim da resolução."; cap.className = "rcap";
    o.querySelector("[data-done]").style.display = ""; o.querySelector("[data-skip]").style.display = "none"; };
  o.querySelector("[data-skip]").onclick = skip;
  o.querySelector("[data-done]").onclick = finish;
}

/* ---------- Navegação ---------- */
// Só cenários com dados completos e não bloqueados podem ser abertos (1964 está locked; ids antigos/desconhecidos, como o
// cenário de 1924 removido, são recusados). Não há parâmetros de URL; o último cenário salvo em LAST_SCEN_KEY não é reaberto sozinho.
const playable = sc => !!(sc && !sc.soon && !sc.locked && sc.story && sc.campaign);
function setScenario(id){
  const sc = SCENARIOS.find(x => x.id === id);
  if (!playable(sc)) return false;
  SCEN = sc;
  STORY = SCEN.story;
  try{ localStorage.setItem(LAST_SCEN_KEY, id); }catch(e){}
  $("#hdrTitle").textContent = SCEN.title + " · " + SCEN.year;
  return true;
}
function headerButtons(inGame){

}
function renderMenu(){
  SCEN = null; STORY = null; G = null;

      <div class="mapbox" data-map="${sc.id}"></div></div>`;
  }).join("");
  // bloqueados: só leitura de dados estáticos (não lê nem migra saves locais deles)
  const soon = later.map(sc => `<div class="scen soon" aria-disabled="true" title="Indisponível por enquanto"><div class="yr">${esc(sc.year)}</div><div class="tag">${esc(sc.tag || "Próximo cenário")}</div>

  $("#app").innerHTML = `<div class="menu-head"><h2>Crônicas da Separação</h2><p>Campanha por turnos mensais: diplomacia, facções, exércitos no mapa e finais diferentes.</p></div>

      <div class="ftree-wrap" id="ftWrap" tabindex="0" role="region" aria-label="Árvore de decisões: arraste ou role para navegar"><div class="ftree-size" id="ftSize" style="width:${Gm.W * z}px;height:${Gm.H * z}px"><div class="ftree" id="ftTree" style="width:${Gm.W}px;height:${Gm.H}px;transform:scale(${z})">${focusSVG(T, Gm)}${nodes}</div></div></div>

  const wrap = $("#ftWrap"), size = $("#ftSize"), tree = $("#ftTree"), lbl = $("#fzLbl");
  if (UI.fscroll) { wrap.scrollLeft = UI.fscroll[0]; wrap.scrollTop = UI.fscroll[1]; }
  else { const c = act || focusDef(G, "t_balanco") || T.nodes[0]; wrap.scrollLeft = Math.max(0, Gm.X(c.x) * z - wrap.clientWidth / 2); wrap.scrollTop = Math.max(0, Gm.Y(c.y) * z - 40); }
  wrap.onscroll = () => { UI.fscroll = [wrap.scrollLeft, wrap.scrollTop]; };

  const setZoom = (nz, px, py) => {

  wrap.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;

  wrap.addEventListener("pointerup", endDrag); wrap.addEventListener("pointercancel", endDrag);

  wrap.addEventListener("touchmove", e => {
    if (pinch && e.touches.length === 2){ e.preventDefault(); const r = wrap.getBoundingClientRect(); setZoom(pinch.z * dist(e.touches) / pinch.d, (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top); }

  el.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {

}

function coachRun(ctx){
  coachClose();

  let i = 0;

  document.body.appendChild(el); coachEl = el;
  const ring = el.querySelector(".cring"), bub = el.querySelector(".cbub");
  const done = () => { tutMark(ctx); coachClose(); setTimeout(tutAfterRender, 250); };

    const st = steps[i], t = st.sel && document.querySelector(st.sel);
    const vw = window.innerWidth, vh = window.innerHeight, bw = Math.min(360, vw - 20);
    if (!t){ ring.className = "cring none"; ring.removeAttribute("style"); bub.style.left = (vw - bw) / 2 + "px"; bub.style.top = Math.max(10, vh * 0.25) + "px"; return; }

    ring.className = "cring"; Object.assign(ring.style, { left: R.l + "px", top: R.t + "px", width: (R.r - R.l) + "px", height: (R.b - R.t) + "px" });

    let top = R.b + 12; if (top + bh > vh - 8) top = R.t - bh - 12; if (top < 8) top = Math.max(8, Math.min(vh - bh - 8, R.t + 12));
    let left = Math.min(Math.max(10, R.l), vw - bw - 10);

  };

    const st = steps[i], t = st.sel && document.querySelector(st.sel);
    if (t){ const r = t.getBoundingClientRect(); if (r.top < 60 || r.bottom > window.innerHeight - 60) t.scrollIntoView({ block: r.height > window.innerHeight * 0.6 ? "start" : "center" }); }

  };

    golpe_inicial: { head: "Blindados na Esplanada", sub: "Tropas leais a você ocupam Brasília e a ordem constitucional é rompida. Governadores, tribunais, ruas e o mundo vão reagir. Não há volta." },
    racha_militar: { head: "Racha nas Forças Armadas", sub: "Comandos inteiros recusam suas ordens e se declaram em defesa da Constituição. O monopólio da força acabou." },
    guerra: { head: "O país está partido", sub: "Estados rompem com Brasília e a resistência pega em armas. Começa a guerra civil — cada frente agora decide o destino do Brasil." },
    inelegivel: { head: "Inelegível", sub: "O tribunal tira você das urnas por oito anos. Você ainda move multidões; a pergunta é o que fazer com elas." }
  }
};
const PHASE_WHY = {
  oposicao: "o poder está passando ao presidente eleito: as Forças Armadas voltaram à cadeia de comando regular e não obedecem mais às suas ordens políticas",
  governo: "a crise armada terminou e as tropas voltaram aos quartéis"
};
function majorSnap(){
  if (!G) return null;
  const ph = phaseOf(G);
  return { ph: ph.id, label: ph.label, war: !!ph.war, noArmies: !!ph.noArmies, income: ph.income, pace: paceFor(G), vis: G.visited.length,
    armies: armiesOf(G, "player").map(a => ({ name: a.name, str: a.str })), stats: Object.assign({}, G.stats), control: Object.assign({}, G.control) };
}
function majorCheck(b){
  if (!b || !G || G.ended) return null;
  const ph = phaseOf(G), cfg = MAJOR_NODES[SCEN.id] || {};
  const fresh = G.visited.slice(b.vis).filter(n => cfg[n]);
  const phaseChanged = ph.id !== b.ph;
  if (!fresh.length && !phaseChanged) return null;
  const node = fresh[fresh.length - 1], M = node ? cfg[node] : null;
  const C = SCEN.campaign, cons = [];
  const nowA = armiesOf(G, "player"), lost = b.armies.length - nowA.length;
  if (b.armies.length && ph.noArmies){
    const tot = Math.round(b.armies.reduce((s, a) => s + a.str, 0));
    cons.push({ k: "bad", t: `${b.armies.length === 1 ? `Seu exército (força ${tot}) foi desmobilizado` : `Seus ${b.armies.length} exércitos (força total ${tot}) foram desmobilizados`} porque ${PHASE_WHY[ph.id] || "nesta fase você não comanda tropas"}.` });
  } else if (lost > 0) cons.push({ k: "bad", t: `Você perdeu ${lost} exército(s) nesta virada.` });
  if (phaseChanged){
    cons.push({ k: "", t: `Nova fase: ${ph.label}${ph.war ? " — em guerra" : ""}.` });
    if (ph.war && !b.war) cons.push({ k: "bad", t: "Começou a guerra: as frentes de combate estão abertas. Dê ordens aos seus exércitos na aba Mapa — elas não gastam AP." });
    if (!ph.war && b.war) cons.push({ k: "good", t: "A guerra terminou: não há mais frentes de combate." });
    if (ph.noArmies && !b.noArmies) cons.push({ k: "", t: "Agora a luta é política: use propaganda, investimentos e acordos com governadores no mapa, além de diplomacia e facções." });
    if ((ph.income ?? 0) !== (b.income ?? 0)) cons.push({ k: (ph.income ?? 0) < (b.income ?? 0) ? "bad" : "good", t: `Renda básica de ${C.money.label}: ${b.income ?? 0} → ${ph.income ?? 0} por mês.` });
  }
  const pace = paceFor(G); if (pace !== b.pace) cons.push({ k: "", t: pace > 1 ? `Os turnos passam a durar ${pace} meses.` : "Os turnos voltam a durar um mês." });
  const ch = Object.keys(G.control).filter(u => G.control[u] !== b.control[u]).map(u => ({ uf: u, to: G.control[u] }));
  if (ch.length) cons.push({ k: "", t: "Mapa: " + changeNotes(ch).join("; ") + "." });
  const deltas = Object.keys(STORY.stats).map(k => [k, Math.round(G.stats[k] - b.stats[k])]).filter(([, d]) => d);
  if (deltas.length) cons.push({ k: "", t: deltas.map(([k, d]) => `${STORY.stats[k].label} ${d > 0 ? "+" : "−"}${Math.abs(d)}`).join(" · ") });
  const head = M ? M.head : ph.label, sub = M ? M.sub : `O jogo mudou de fase: ${ph.label}.`;
  return { tone: M && M.tone || "red", head, sub, cons };
}
function showMajor(m, done){
  if (!m){ done && done(); return; }
  document.querySelectorAll(".major").forEach(x => x.remove());
  coachClose();
  const o = document.createElement("div"); o.className = "major " + (m.tone === "gold" ? "gold" : "");
  o.setAttribute("role", "alertdialog"); o.setAttribute("aria-modal", "true"); o.setAttribute("aria-labelledby", "majorH"); o.setAttribute("aria-describedby", "majorS");
  o.innerHTML = `<div class="mstripe t"></div><div class="mbox"><div class="mkick">⚠ Última hora ⚠</div><div class="mdate">${esc(monthLabel(G.month))}</div>
    <h2 id="majorH">${esc(m.head)}</h2><p class="msub" id="majorS">${esc(m.sub)}</p>
    ${m.cons.length ? `<div class="mcons"><h3>O que muda para você</h3><ul>${m.cons.map(c => `<li class="${c.k}">${esc(c.t)}</li>`).join("")}</ul></div>` : ""}
    <button class="primary mgo">Continuar ▸</button></div><div class="mstripe b"></div>`;
  document.body.appendChild(o); document.body.classList.add("noscroll");
  const close = () => { o.remove(); document.body.classList.remove("noscroll"); document.removeEventListener("keydown", key, true); done && done(); setTimeout(tutAfterRender, 200); };
  const key = e => { if (e.key === "Escape" || e.key === "Enter"){ e.preventDefault(); close(); } };
  document.addEventListener("keydown", key, true);
  o.querySelector(".mgo").onclick = close;
  setTimeout(() => o.querySelector(".mgo").focus({ preventScroll: true }), 50);
}

/* ---------- Ajuda: refazer/pular tutorial + glossário curto ---------- */
function openHelp(){
  document.querySelectorAll("#helpModal").forEach(x => x.remove());
  const s = tutState(), C = SCEN && SCEN.campaign;
  const m = document.createElement("div");
  m.className = "modal"; m.id = "helpModal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true"); m.setAttribute("aria-labelledby", "helpT");
  m.innerHTML = `<div class="modal-card"><h2 id="helpT">Ajuda</h2>
    <p class="muted">O tutorial agora são dicas curtas que aparecem na primeira vez que você abre cada aba.</p>
    <div class="helpgrid">
      <button class="primary" id="hRedo">↻ Refazer tutorial</button>
      <label class="tgl"><input type="checkbox" id="hOn" ${s.off ? "" : "checked"}> Mostrar dicas ao abrir abas novas</label>
    </div>
    <details><summary>Glossário rápido</summary><dl class="gloss">
      <dt>Ações (AP)</dt><dd>Pontos de ação do turno. Quase tudo custa 1 AP. Recarregam a cada mês e não acumulam.</dd>
      <dt>${esc(C ? C.money.label : "Recursos")}</dt><dd>Capital político para gastar em investimentos, agrados, missões e tropas. Ganho por mês: território, economia e facções leais, menos manutenção e sanções. No negativo, você perde apoio todo mês.</dd>
      ${STORY ? Object.entries(STORY.stats).map(([k, v]) => `<dt>${esc(v.label)}</dt><dd>${esc(STAT_HELP[k] || "")} Se chegar a zero, a campanha termina.</dd>`).join("") : ""}
      <dt>Agitação</dt><dd>Tensão em cada estado (0–100). Média acima de 62 nos seus estados derruba o apoio; um estado acima de 88 sem tropas pode se revoltar. Investir, fazer propaganda e negociar com o governador baixam a agitação.</dd>
      <dt>Facções</dt><dd>Lealdade (do seu lado?) e influência (quanto pesam). Lealdade abaixo de 15 com influência 25 ou mais gera crises.</dd>
      <dt>Focos (Decisões)</dt><dd>Projetos de vários meses, um por vez. Ao concluir, aplicam efeitos e liberam opções.</dd>
      <dt>Exércitos e ordens</dt><dd>Contadores azuis no mapa (o número é a força). Ordens não gastam AP; o limite por mês depende do Apoio Militar e da lealdade dos militares.</dd>
    </dl></details>
    <div class="disclaimer">${esc(SCEN ? SCEN.intro.disclaimer : "Obra de ficção / história alternativa.")}</div>
    <div class="row2"><button class="secondary" id="btnHelpClose">Fechar</button></div></div>`;
  document.body.appendChild(m);
  const close = () => { m.remove(); document.removeEventListener("keydown", key, true); };
  const key = e => { if (e.key === "Escape"){ e.preventDefault(); close(); } };
  document.addEventListener("keydown", key, true);
  m.onclick = e => { if (e.target === m) close(); };
  $("#btnHelpClose").onclick = close;
  $("#hOn").onchange = e => { const st = tutState(); st.off = !e.target.checked; tutSave(st); };
  $("#hRedo").onclick = () => { tutReset(); close(); if (G && !G.ended){ UI.tab = UI.tab || "historia"; renderGame(); } else toast && toast("Tutorial reiniciado: as dicas aparecem quando você começar a jogar.", "good"); };
  setTimeout(() => $("#hRedo").focus(), 30);
}

$("#btnMenu").onclick = renderMenu;
$("#btnHelp").onclick = openHelp;
$("#btnRestart").onclick = () => {
  if (confirm("Recomeçar a campanha do início? O progresso atual será perdido.")){
    try{ localStorage.removeItem(SCEN.saveKey); }catch(e){}
    cloud("deleteSave", SCEN.id);
    G = null; renderTitle();
  }
};
// Ponte de leitura para cloud.js (módulo separado; o jogo funciona sem ele)
window.GWGame = {
  scenarios: () => SCENARIOS.filter(playable).map(sc => ({ id: sc.id, year: sc.year, title: sc.title, saveKey: sc.saveKey, endingsKey: sc.endingsKey,
    endings: Object.entries(sc.story.nodes).filter(([, n]) => n.ending).map(([id, n]) => ({ id, name: n.endingName })) })),
  saveVersion: SAVE_VERSION,
  minSaveVersion: 2, // saves v2 da nuvem são aceitos e migrados ao abrir
  monthLabel: m => monthLabel(m),

    if (SCEN && !playable(SCEN)){ G = null; renderMenu(); return; }
    if (G && SCEN && changed && changed.includes(SCEN.id)){ G = null; renderTitle(); return; }
    if (!G){ if (SCEN) renderTitle(); else renderMenu(); }
  }
};
